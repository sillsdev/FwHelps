name: Trigger FieldWorks Patch Build

# This workflow triggers a patch build in the FieldWorks repository
# when changes are merged into the develop branch of FwHelps

on:
  push:
    branches:
      - develop

jobs:
  trigger-patch-build:
    name: Trigger FieldWorks Patch Installer Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Trigger FieldWorks Patch Build
        uses: actions/github-script@v7
        env:
          # Update this to target a different FieldWorks release branch
          FIELDWORKS_BRANCH: 'release/9.3'
        with:
          github-token: ${{ secrets.FIELDWORKS_WORKFLOW_TOKEN }}
          script: |
            // Trigger the FieldWorks patch build
            // By passing an empty inputs object, all parameters will use their default values:
            // - helps_ref defaults to 'develop' (will use latest from develop branch)
            // - fw_ref defaults to '' (uses the branch specified in 'ref' parameter)
            // - lcm_ref defaults to 'master'
            // - localizations_ref defaults to 'develop'
            // - installer_ref defaults to 'master'
            // - base_release defaults to 'build-1188'
            // - base_build_number defaults to '1188'
            // - make_release defaults to 'true' (will upload to S3)
            await github.rest.actions.createWorkflowDispatch({
              owner: 'sillsdev',
              repo: 'FieldWorks',
              workflow_id: 'patch-installer-cd.yml',
              ref: process.env.FIELDWORKS_BRANCH,
              inputs: {}
            });

            core.info('Successfully triggered FieldWorks patch build');
            core.info(`Target branch: ${process.env.FIELDWORKS_BRANCH}`);
            core.info('All inputs will use their default values from the target workflow');
