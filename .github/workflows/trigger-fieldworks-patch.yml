name: Trigger FieldWorks Patch Build

# This workflow triggers a patch build in the FieldWorks repository
# when changes are merged into the develop branch of FwHelps

on:
  push:
    branches:
      - develop

jobs:
  trigger-patch-build:
    name: Trigger FieldWorks Patch Installer Build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger FieldWorks Patch Build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FIELDWORKS_WORKFLOW_TOKEN }}
          script: |
            const result = await github.rest.actions.createWorkflowDispatch({
              owner: 'sillsdev',
              repo: 'FieldWorks',
              workflow_id: 'patch-installer-cd.yml',
              ref: 'release/9.3',
              inputs: {
                helps_ref: '${{ github.sha }}',
                fw_ref: '',
                lcm_ref: '',
                localizations_ref: '',
                installer_ref: '',
                base_release: '',
                base_build_number: '',
                make_release: 'true'
              }
            });

            console.log('Successfully triggered FieldWorks patch build');
            console.log('Using FwHelps commit:', '${{ github.sha }}');
