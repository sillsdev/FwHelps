name: Trigger FieldWorks Patch Build

# This workflow triggers a patch build in the FieldWorks repository
# when changes are merged into the develop branch of FwHelps

on:
  push:
    branches:
      - develop

jobs:
  trigger-patch-build:
    name: Trigger FieldWorks Patch Installer Build
    runs-on: ubuntu-latest

    steps:
      - name: Trigger FieldWorks Patch Build
        uses: actions/github-script@v7
        env:
          # Update this to target a different FieldWorks release branch
          FIELDWORKS_BRANCH: 'release/9.3'
        with:
          github-token: ${{ secrets.FIELDWORKS_WORKFLOW_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: 'sillsdev',
              repo: 'FieldWorks',
              workflow_id: 'patch-installer-cd.yml',
              ref: process.env.FIELDWORKS_BRANCH,
              inputs: {
                // Use the specific commit SHA from FwHelps that was just merged
                helps_ref: '${{ github.sha }}',
                // Set make_release to 'true' to upload the build to S3
                make_release: 'true'
                // All other inputs will use their default values from the target workflow
              }
            });

            console.log('Successfully triggered FieldWorks patch build');
            console.log('Target branch:', process.env.FIELDWORKS_BRANCH);
            console.log('Using FwHelps commit:', '${{ github.sha }}');
