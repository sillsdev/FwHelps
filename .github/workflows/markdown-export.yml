name: Markdown Export

# Converts FieldWorks_Language_Explorer_Help.chm into a markdown corpus and
# publishes it to the `markdown-export` orphan branch, where it is consumed by
# the FieldWorks AI bot and readable/diffable by humans.
#
# The CHM is a binary, so there is nothing to diff and every run is a full
# rebuild. That takes ~2 minutes, which is cheap enough not to optimise.

on:
  push:
    branches: [develop]
    tags: ['FieldWorks*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and report, but do not publish'
        type: boolean
        default: false

concurrency:
  group: markdown-export
  cancel-in-progress: false

permissions:
  contents: write

env:
  PANDOC_VERSION: '3.9.0.2'
  EXPORT_BRANCH: markdown-export

jobs:
  export:
    name: Convert CHM to markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: src
          fetch-depth: 1

      - name: Install pandoc and CHM extractor
        run: |
          set -euo pipefail
          # Pinned rather than apt's pandoc: the Lua filter uses the pandoc 3.x
          # Table API (el.bodies / colspecs), which pandoc 2.x does not expose.
          curl -fsSL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          pandoc --version | head -2
          7z i > /dev/null && echo "7z ok"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: pip install --quiet pymupdf

      - name: Convert
        run: |
          set -euo pipefail
          python src/tools/convert.py \
            --repo src \
            --out export \
            --work "${RUNNER_TEMP}/chm" \
            --source-ref "${GITHUB_SHA::7}"

      # convert.py exits non-zero on a corrupt extraction, a pandoc failure, or
      # an unmapped semantic class. Everything else -- broken links, oversized
      # topics -- is advisory and lands in author-report.json for the doc
      # author, because blocking a release on an editorial opinion just trains
      # people to bypass CI.
      - name: Summarise quality report
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("export/author-report.json")
          if not p.exists():
              print("## Markdown Export\n\nNo report produced — the build failed early.")
              raise SystemExit(0)
          r = json.loads(p.read_text(encoding="utf-8"))
          print(f"## Markdown Export — help {r.get('fw_help_version','?')}\n")
          print(f"**{r.get('topics',0):,} topics converted**\n")
          print("| Check | Count |\n| --- | ---: |")
          for k in ("pandoc_failures", "unmapped_span_classes", "broken_links",
                    "not_in_toc", "oversized", "undersized"):
              print(f"| {k.replace('_',' ')} | {len(r.get(k, []))} |")
          for k in ("broken_links", "not_in_toc"):
              items = r.get(k, [])
              if items:
                  print(f"\n<details><summary>{k.replace('_',' ')} ({len(items)})</summary>\n")
                  for it in items[:50]:
                      print(f"- `{it}`")
                  print("\n</details>")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-export
          path: export
          retention-days: 14

      - name: Publish to orphan branch
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd export
          git init -q -b "${EXPORT_BRANCH}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          # The branch has no shared history with develop by design, so each
          # build replaces it wholesale. Diffs stay readable because the tree is
          # 1:1 with topics -- one edited topic is one changed file.
          git commit -q -m "Markdown export of help ${GITHUB_SHA::7}

          Generated from FieldWorks_Language_Explorer_Help.chm by
          .github/workflows/markdown-export.yml. Do not edit by hand.

          Source: ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push -f origin "${EXPORT_BRANCH}"
          echo "published to ${EXPORT_BRANCH}"

      - name: Tag the export to match the release
        if: startsWith(github.ref, 'refs/tags/FieldWorks')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd export
          # FwHelps is already tagged FieldWorks<version> by the FieldWorks
          # repo's Build/releaseTagger.py, so the export can carry the same
          # version identity and stay linkable from the README version table.
          TAG="${EXPORT_BRANCH}/${GITHUB_REF_NAME}"
          git tag -a "$TAG" -m "Markdown export for ${GITHUB_REF_NAME}"
          git push -f origin "refs/tags/${TAG}"
          echo "tagged $TAG"
